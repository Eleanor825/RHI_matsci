project:
  title: "SD-Worth: Source-Decomposed Action Worthiness for Scientific Agents"
  question: "Can a scientific-agent harness estimate calibrated positive net scientific gain with decomposed agent-internal and evidence-external uncertainty while controlling selective risk under held-out scientific regimes?"
  status: active
  target: ICLR
  started: 2026-08-21

objective_requirements:
  strict_net_scientific_gain: stable_train_only_opportunity_cost_validated_across_true_regime_folds
  internal_external_variance_decomposition: h17_secondary_probability_score_35_5_percent_above_matched_no_source_but_expected_value_primary_failed
  calibrated_action_worthiness: h14_extreme_h15_unique_and_h17_pairwise_positive_development_with_h17_secondary_confirmatory_3_of_4
  selective_risk_guarantee: exact_certificate_respected_on_all_four_true_regime_folds
  real_matbot_tool_trajectories: instrumentation_ready_live_count_zero
  multi_model_multi_task_heldout_regime: three_task_development_available_pairwise_secondary_confirmatory_multimodel_final_protocol_pending
  beat_static_reliability_and_llm_judge: static_baselines_beaten_llm_judge_pending

current_phase: h18_external_voe_confirmed_source_ablation_unresolved_gpt_pilot_positive
active_hypothesis: calibrated_counterfactual_value_of_evidence_plus_verify_before_execute_beats_success_confidence_for_costly_scientific_actions
